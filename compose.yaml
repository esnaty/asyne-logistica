services:
  database:
    image: postgis/postgis:17-3.5-alpine
    container_name: asyne-database
    environment:
      POSTGRES_DB: asyne
      POSTGRES_USER: asyne
      POSTGRES_PASSWORD: asyne
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asyne -d asyne"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: asyne-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  optimizer:
    build:
      context: .
      dockerfile: services/optimizer/Dockerfile
    container_name: asyne-optimizer
    ports:
      - "8000:8000"
    volumes:
      - ./services/optimizer/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: asyne-api
    command: sh -c "npm run db:migrate --workspace @asyne/api && npm run dev --workspace @asyne/api"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://asyne:asyne@database:5432/asyne
      REDIS_URL: redis://redis:6379
      OPTIMIZER_URL: http://optimizer:8000
      ACCESS_TOKEN_SECRET: development-only-access-token-secret-change-me
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 5s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: asyne-admin
    command: sh -c "npm install --workspaces --include-workspace-root && npm run dev --workspace @asyne/admin -- --host 0.0.0.0 --port 5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - admin_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    container_name: asyne-mobile
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "5174:5174"
    volumes:
      - .:/workspace
      - mobile_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  admin_node_modules:
  mobile_node_modules:
  api_node_modules:
  postgres_data:
  redis_data:
